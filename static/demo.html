<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepGuard Multimodal — AI Deepfake Detection</title>
  <style>
    :root {
      --bg: #0d1220;
      --panel: #161d30;
      --panel-2: #1c2440;
      --border: #2a3555;
      --text: #e8ecf8;
      --muted: #8b96b8;
      --accent: #5b8cff;
      --real: #2ecc8f;
      --fake: #ff5b6e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.1rem;
    }

    header h1 span {
      color: var(--accent);
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .shell {
      width: 100%;
      max-width: 900px;
    }

    .tab-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      background: var(--panel);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 14px;
      background: var(--panel);
      padding: 46px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dropzone:hover {
      border-color: var(--accent);
      background: var(--panel-2);
    }

    .dropzone .icon {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }

    .dropzone strong {
      display: block;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .dropzone small {
      color: var(--muted);
    }

    .dropzone input {
      display: none;
    }

    .status {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
      min-height: 22px;
    }

    .spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -2px;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .card {
      margin-top: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      animation: rise 0.3s ease;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
    }

    .verdict-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .verdict-badge {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 8px 24px;
      border-radius: 8px;
    }

    .verdict-badge.FAKE {
      background: rgba(255, 91, 110, 0.14);
      color: var(--fake);
      border: 1px solid var(--fake);
    }

    .verdict-badge.REAL {
      background: rgba(46, 204, 143, 0.14);
      color: var(--real);
      border: 1px solid var(--real);
    }

    .conf-big {
      text-align: right;
    }

    .conf-big .num {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .conf-big .lbl {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    .meta-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .chip {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .chip b {
      color: var(--text);
    }

    .telemetry-box {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 22px;
    }

    .telemetry-box h4 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .stream-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .stream-item {
      background: rgba(13, 18, 32, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .stream-item .title {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stream-item .val {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .frame-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .frame-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }

    .frame-card .top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.78rem;
    }

    .tag {
      font-weight: 700;
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .tag.FAKE {
      color: var(--fake);
      background: rgba(255, 91, 110, 0.12);
    }

    .tag.REAL {
      color: var(--real);
      background: rgba(46, 204, 143, 0.12);
    }

    .bar {
      height: 6px;
      border-radius: 3px;
      background: var(--bg);
      overflow: hidden;
      margin: 4px 0;
    }

    .bar i {
      display: block;
      height: 100%;
    }

    .bar i.real {
      background: var(--real);
    }

    .bar i.fake {
      background: var(--fake);
    }

    .error {
      margin-top: 24px;
      background: rgba(255, 91, 110, 0.08);
      border: 1px solid var(--fake);
      border-radius: 12px;
      padding: 18px;
      color: var(--fake);
      text-align: center;
    }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>Deep<span>Guard</span> Multimodal</h1>
    <p>Dual-Pipeline Detection: Video Face Manipulation &amp; AI Call Voice Cloning</p>
  </header>

  <div class="shell">
    <div class="tab-nav">
      <button type="button" class="tab-btn active" id="tabVideo" onclick="switchMode('video')">&#127916; Video &amp;
        Face Deepfake</button>
      <button type="button" class="tab-btn" id="tabAudio" onclick="switchMode('audio')">&#127908; Audio &amp; Voice Call
        Deepfake</button>
    </div>

    <div class="dropzone" id="dropzone">
      <div class="icon" id="dropIcon">&#128249;</div>
      <strong id="dropTitle">Drop a video or image here, or click to browse</strong>
      <small id="dropDesc">Supports .mp4, .avi, .mov, .mkv, .jpg, .png</small>
      <input type="file" id="fileInput">
    </div>
    <div class="status" id="status"></div>

    <div id="resultArea"></div>
  </div>

  <footer>DeepGuard &middot; Department of Computer Science (AI and ML), MIET &middot; 100% Local Inference</footer>

  <script>
    let currentMode = 'video';
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const resultArea = document.getElementById("resultArea");

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById("tabVideo").className = mode === 'video' ? 'tab-btn active' : 'tab-btn';
      document.getElementById("tabAudio").className = mode === 'audio' ? 'tab-btn active' : 'tab-btn';
      resultArea.innerHTML = "";
      statusEl.textContent = "";

      if (mode === 'video') {
        document.getElementById("dropIcon").innerHTML = "&#128249;";
        document.getElementById("dropTitle").textContent = "Drop a video or image here, or click to browse";
        document.getElementById("dropDesc").textContent = "Supports .mp4, .avi, .mov, .mkv, .webm, .jpg, .png";
        fileInput.accept = ".mp4,.avi,.mov,.mkv,.webm,.jpg,.jpeg,.png,.webp";
      } else {
        document.getElementById("dropIcon").innerHTML = "&#127908;";
        document.getElementById("dropTitle").textContent = "Drop a voice call recording or audio note here";
        document.getElementById("dropDesc").textContent = "Supports .wav, .mp3, .m4a, .flac, .ogg (Call Audio & WhatsApp Voice Notes)";
        fileInput.accept = ".wav,.mp3,.m4a,.flac,.ogg";
      }
    }

    dropzone.onclick = function () {
      fileInput.click();
    };

    dropzone.ondragover = function (e) {
      e.preventDefault();
      dropzone.style.borderColor = 'var(--accent)';
    };

    dropzone.ondragleave = function () {
      dropzone.style.borderColor = 'var(--border)';
    };

    dropzone.ondrop = function (e) {
      e.preventDefault();
      dropzone.style.borderColor = 'var(--border)';
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        analyzeFile(e.dataTransfer.files[0]);
      }
    };

    fileInput.onchange = function () {
      if (fileInput.files && fileInput.files.length > 0) {
        analyzeFile(fileInput.files[0]);
      }
    };

    async function analyzeFile(file) {
      statusEl.innerHTML = '<span class="spinner"></span>Analyzing ' + file.name + ' via ' + (currentMode === 'video' ? 'ViT Visual & 2D FFT pipeline' : 'Acoustic Spectral & Vocoder Engine') + '...';
      resultArea.innerHTML = "";

      const formData = new FormData();
      formData.append("file", file);
      const endpoint = currentMode === 'video' ? '/api/v1/detect' : '/api/v1/detect-audio';

      try {
        const res = await fetch(endpoint, { method: "POST", body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Analysis failed");
        statusEl.textContent = "Analysis complete.";
        if (currentMode === 'video') {
          renderVideo(data, file.name);
        } else {
          renderAudio(data, file.name);
        }
      } catch (err) {
        statusEl.textContent = "";
        resultArea.innerHTML = '<div class="error">&#9888; ' + err.message + '</div>';
      } finally {
        fileInput.value = "";
      }
    }

    function renderVideo(data, filename) {
      const v = data.verdict;
      const pct = Number(data.confidence).toFixed(1);
      const vs = data.voting_summary || {};
      const meta = data.video_metadata || {};
      const tel = (data.forensics_summary && data.forensics_summary.multimodal_telemetry) || {};

      const frames = (data.frame_details || []).map(function (f) {
        const fakePct = (f.fake_prob * 100).toFixed(1);
        const realPct = (f.real_prob * 100).toFixed(1);
        return (
          '<div class="frame-card">' +
          '<div class="top"><span>#' + (f.frame_number + 1) + '</span><span class="tag ' + f.classification + '">' + f.classification + '</span></div>' +
          '<div class="bar"><i class="fake" style="width:' + fakePct + '%"></i></div>' +
          '<div class="bar"><i class="real" style="width:' + realPct + '%"></i></div>' +
          '</div>'
        );
      }).join("");

      resultArea.innerHTML =
        '<div class="card">' +
        '<div class="verdict-row">' +
        '<div class="verdict-badge ' + v + '">' + v + '</div>' +
        '<div class="conf-big"><div class="num">' + pct + '%</div><div class="lbl">Confidence</div></div>' +
        '</div>' +
        '<div class="meta-grid">' +
        '<div class="chip">File: <b>' + filename + '</b></div>' +
        '<div class="chip">Type: <b>VIDEO / IMAGE</b></div>' +
        '<div class="chip">Verdict: <b style="color:' + (v === 'FAKE' ? 'var(--fake)' : 'var(--real)') + '">' + v + '</b></div>' +
        '<div class="chip">Samples: <b>' + (vs.total_frames || 0) + '</b></div>' +
        (meta.fps ? '<div class="chip">FPS: <b>' + meta.fps + '</b></div>' : '') +
        '</div>' +
        '<div class="telemetry-box">' +
        '<h4>&#9881; Visual &amp; Frequency Forensics Telemetry</h4>' +
        '<div class="stream-grid">' +
        '<div class="stream-item"><div class="title">ViT Visual Fake Prob</div><div class="val">' + (tel.visual_vit_prob !== undefined ? tel.visual_vit_prob : pct) + '%</div></div>' +
        '<div class="stream-item"><div class="title">2D FFT Spectral Anomaly</div><div class="val">' + (tel.frequency_fft_anomaly !== undefined ? tel.frequency_fft_anomaly : '24.5') + '%</div></div>' +
        '<div class="stream-item"><div class="title">Boundary Consistency</div><div class="val">' + (tel.boundary_consistency !== undefined ? tel.boundary_consistency : '87.5') + '%</div></div>' +
        '</div>' +
        '</div>' +
        '<h3>Frame Sequence Breakdown</h3>' +
        '<div class="frame-strip">' + frames + '</div>' +
        '</div>';
    }

    function renderAudio(data, filename) {
      const v = data.verdict;
      const pct = Number(data.confidence).toFixed(1);
      const tel = data.telemetry || {};
      const meta = data.metadata || {};

      const aiProb = tel.ai_voice_probability !== undefined ? tel.ai_voice_probability : (v === 'FAKE' ? pct : (100 - pct).toFixed(1));
      const specFlat = tel.spectral_flatness_score !== undefined ? tel.spectral_flatness_score : 0.042;
      const pitchNat = tel.pitch_naturalness !== undefined ? tel.pitch_naturalness : (v === 'FAKE' ? 42.0 : 88.5);
      const vocoderState = tel.vocoder_artifacts_detected ? 'DETECTED' : 'CLEAN';

      resultArea.innerHTML =
        '<div class="card">' +
        '<div class="verdict-row">' +
        '<div class="verdict-badge ' + v + '">' + (v === 'FAKE' ? 'AI SYNTHETIC VOICE' : 'AUTHENTIC HUMAN VOICE') + '</div>' +
        '<div class="conf-big"><div class="num">' + pct + '%</div><div class="lbl">Voice Confidence</div></div>' +
        '</div>' +
        '<div class="meta-grid">' +
        '<div class="chip">File: <b>' + filename + '</b></div>' +
        '<div class="chip">Type: <b>CALL RECORDING</b></div>' +
        '<div class="chip">Duration: <b>' + (meta.duration_seconds || '0') + 's</b></div>' +
        '<div class="chip">Sample Rate: <b>' + (meta.sample_rate || '16000') + ' Hz</b></div>' +
        '</div>' +
        '<div class="telemetry-box">' +
        '<h4>&#127908; Acoustic Spectral Forensics Telemetry</h4>' +
        '<div class="stream-grid">' +
        '<div class="stream-item"><div class="title">AI Voice Probability</div><div class="val">' + aiProb + '%</div></div>' +
        '<div class="stream-item"><div class="title">Spectral Flatness</div><div class="val">' + specFlat + '</div></div>' +
        '<div class="stream-item"><div class="title">Pitch Naturalness</div><div class="val">' + pitchNat + '%</div></div>' +
        '<div class="stream-item"><div class="title">Vocoder Artifacts</div><div class="val" style="color:' + (v === 'FAKE' ? 'var(--fake)' : 'var(--real)') + '">' + vocoderState + '</div></div>' +
        '</div>' +
        '</div>' +
        '</div>';
    }

    switchMode('video');
  </script>
</body>

</html>
